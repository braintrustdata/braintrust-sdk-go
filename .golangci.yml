version: "2"
linters:
  default: standard
  exclusions:
      paths:
        # Vendored third-party code, kept as close to upstream as possible so
        # re-syncing stays a readable diff. See internal/mustache/VENDOR.md.
        - internal/mustache
      rules:
        - text: "^unused-parameter:"
          linters: [revive]
        - text: "^exported:"
          linters: [revive]
          path: braintrust/internal
        - text: "package-comments:"
          linters: [revive]
          path: braintrust/internal
        - text: "package-comments:"
          linters: [revive]
          path: examples/
        - linters: [forcetypeassert]
          path: _test\.go



  enable:
    - bodyclose
    - forcetypeassert # catches potential panics
    # - usetesting      # nice-to-have not critical (disabled to reduce PR noise)
    - thelper         # nice-to-have not critical
    - revive          # critical for ensuring public functions/packages have docs.


formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/braintrustdata/braintrust-sdk-go
