# This workflow is triggered when a new tag is pushed to main.
# It can also be run manually to re-publish a release in case it failed for some reason.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GO_TEST_FLAGS: -timeout=10m

# NOTE: we pin specific versions below so the publish is reproducible.
jobs:
  release:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        timeout-minutes: 5
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # go-version-file selects the SDK minimum, not the toolchain directive.
          go-version: 1.27.x
          cache-dependency-path: '**/go.sum'

      - name: Install golangci-lint
        timeout-minutes: 5
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.15.0
          # make release runs make ci, which already lints every module.
          install-only: true

      - name: Install orchestrion
        timeout-minutes: 5
        env:
          GOTOOLCHAIN: local
        run: go install github.com/DataDog/orchestrion@v1.14.0

      - name: Install goreleaser
        timeout-minutes: 2
        run: |
          cd /tmp
          curl --fail --show-error --location --connect-timeout 10 --max-time 90 \
            --output goreleaser.tar.gz \
            https://github.com/goreleaser/goreleaser/releases/download/v2.12.7/goreleaser_Linux_x86_64.tar.gz
          tar -xzf goreleaser.tar.gz goreleaser
          sudo mv goreleaser /usr/local/bin/
          goreleaser --version

      - name: Publish release
        timeout-minutes: 20
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          # these envars are needed because `make release` runs CI as a final sanity check
          CGO_ENABLED: 0
          GOTOOLCHAIN: local
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
