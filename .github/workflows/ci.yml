name: CI

on:
  push:
    branches: [ main ]  # This runs on pushes/merges to main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.x
      - name: Use local Braintrust modules
        run: ./scripts/apply_local_braintrust_replaces.sh
      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.4

  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.25.x, 1.26.x]
        # FIXME[matt] add windows testing, we need to fix some timing
        # tests.
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: 0
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY}}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY}}
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install orchestrion
        env:
          GOTOOLCHAIN: local
        run: go install github.com/DataDog/orchestrion@v1.12.1
      - name: Verify modules
        run: make mod-verify
        env:
          GOTOOLCHAIN: local
      - name: Use local Braintrust modules for test and build
        run: ./scripts/apply_local_braintrust_replaces.sh
      - name: Test
        run: make test
        env:
          GOTOOLCHAIN: local
      - name: Build
        run: make build
        env:
          GOTOOLCHAIN: local

  ci-passed:
    name: ci-passed
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Mark CI as passed
        run: echo "All CI jobs passed successfully"
