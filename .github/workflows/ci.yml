name: CI

on:
  push:
    branches: [ main ]  # This runs on pushes/merges to main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.24.4, 1.25.x, 1.26.x]
        # FIXME[matt] add windows testing, we need to fix some timing
        # tests.
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: 0
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY}}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY}}
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.4
      - name: Install orchestrion
        env:
          GOTOOLCHAIN: local
        run: go install github.com/DataDog/orchestrion@v1.6.1
      - name: Lint, vet, tests, etc.
        run: make ci
        env:
          GOTOOLCHAIN: local

  ci-passed:
    name: ci-passed
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Mark CI as passed
        run: echo "All CI jobs passed successfully"
