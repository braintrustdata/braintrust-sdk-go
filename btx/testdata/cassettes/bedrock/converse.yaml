        body: '{"metrics":{"latencyMs":1588},"output":{"message":{"content":[{"text":"The capital of France is Paris. Paris is not only the capital but also the largest city in France, known for its significant cultural, political, and economic influence. It is situated in the northern central part of the country, along the Seine River. \n\nParis is internationally renowned for its historical landmarks, art, fashion, cuisine, and contributions to literature and philosophy. Some of its most famous landmarks include:\n\n1. **Eiffel Tower**: An iconic iron lattice tower built for the 1889 Exposition Universelle (World''s Fair).\n2. **Louvre Museum**: One of the world''s largest and most visited museums, home to thousands of works of art, including the Mona Lisa and the Venus de Milo.\n3. **Notre-Dame Cathedral**: A medieval Catholic cathedral on the Île de la Cité, known for its Gothic architecture.\n4. **Champs-Élysées**: A famous avenue that stretches from the Place de la Concorde to the Place Charles de Gaulle.\n5. **Arc de Triomphe**: A historic monument that stands at the western end of the Champs-Élysées.\n6. **Sacré-Cœur Basilica**: Located at the highest point in the city on Montmartre hill, it offers panoramic views of Paris.\n\nParis is also known for its diverse neighborhoods, or \"arrondissements,\" each with its own unique character and attractions. The city has a well-developed public transportation system, including the Metro, buses, and RER trains, making it easy for visitors and residents to navigate.\n\nIn addition to its historical and cultural significance, Paris is a global center for business, hosting numerous multinational companies and serving as a major hub for international diplomacy and commerce. It is also a key player in the fields of fashion, gastronomy, and the arts."}],"role":"assistant"}},"stopReason":"end_turn","usage":{"inputTokens":7,"outputTokens":368,"serverToolUsage":{},"totalTokens":375}}'
