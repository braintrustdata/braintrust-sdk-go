                  "content": [
                    {
                      "type": "output_text",
                      "annotations": [],
                      "logprobs": [],
                      "text": "The easiest way to see what\u2019s going on is to look at the differences:\n\n  2,   6,   12,   20,   30  \n   \u21974   \u21976    \u21978    \u219710  \n\nSince the increments go up by 2 each time, the second difference is constant (2), so the sequence is given by a quadratic in n.  A more direct observation is:\n\n  2 = 1\u00b72  \n  6 = 2\u00b73  \n 12 = 3\u00b74  \n 20 = 4\u00b75  \n 30 = 5\u00b76  \n\nIn other words the nth term is the product of two consecutive integers:\n\n  a\u2099 = n\u2009(n + 1)  \n\nEquivalently,\n\n  a\u2099 = n\u00b2 + n."
