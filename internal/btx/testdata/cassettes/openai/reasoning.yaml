                      "text": "The nth term is  \n  a\u2099 = n(n + 1).  \n\nSo for n = 10:  \n  a\u2081\u2080 = 10\u00b711 = 110.  \n\nThe sum of the first 10 terms is  \n  S\u2081\u2080 = \u2211\u2096\u208c\u2081\u00b9\u2070 k(k + 1)  \n      = \u2211k\u00b2 + \u2211k  \n      = [10\u00b711\u00b721/6] + [10\u00b711/2]  \n      = 385 + 55  \n      = 440.  \n\n(Equivalently, S\u2099 = n(n + 1)(n + 2)/3, so S\u2081\u2080 = 10\u00b711\u00b712/3 = 440.)"
