                      "text": "**Calculating terms and sums**\n\nThe user asks to find the 10th term using the pattern \\( a_n = n(n+1) \\). For the 10th term, I calculate \\( a_{10} = 10 \\times 11 = 110 \\). Then, I find the sum of the first 10 terms. The sum \\( S_{10} = \\sum_{n=1}^{10} n(n+1) = \\sum n^2 + \\sum n \\) equals 440 when calculated. I also mention the closed form for \\( S_n = \\frac{n(n+1)(n+2)}{3} \\)."
