# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/braintrustdata/braintrust-sdk-go/trace/contrib/genkit
  description: Auto-instrumentation for Firebase Genkit with Braintrust tracing
aspects:
  - id: genkit-generate-middleware
    join-point:
      function-call: github.com/firebase/genkit/go/genkit.Generate
    advice:
      - append-args:
          type: github.com/firebase/genkit/go/ai.GenerateOption
          values:
            - imports:
                tracegenkit: github.com/braintrustdata/braintrust-sdk-go/trace/contrib/genkit
                ai: github.com/firebase/genkit/go/ai
              template: ai.WithMiddleware(tracegenkit.NewMiddleware())
  - id: genkit-generatetext-middleware
    join-point:
      function-call: github.com/firebase/genkit/go/genkit.GenerateText
    advice:
      - append-args:
          type: github.com/firebase/genkit/go/ai.GenerateOption
          values:
            - imports:
                tracegenkit: github.com/braintrustdata/braintrust-sdk-go/trace/contrib/genkit
                ai: github.com/firebase/genkit/go/ai
              template: ai.WithMiddleware(tracegenkit.NewMiddleware())
  - id: genkit-generatestream-middleware
    join-point:
      function-call: github.com/firebase/genkit/go/genkit.GenerateStream
    advice:
      - append-args:
          type: github.com/firebase/genkit/go/ai.GenerateOption
          values:
            - imports:
                tracegenkit: github.com/braintrustdata/braintrust-sdk-go/trace/contrib/genkit
                ai: github.com/firebase/genkit/go/ai
              template: ai.WithMiddleware(tracegenkit.NewMiddleware())
  - id: genkit-definetool-tracing
    join-point:
      function-call: github.com/firebase/genkit/go/genkit.DefineTool
    advice:
      - replace-function: github.com/braintrustdata/braintrust-sdk-go/trace/contrib/genkit.DefineTool
  - id: genkit-definetoolwithinputschema-tracing
    join-point:
      function-call: github.com/firebase/genkit/go/genkit.DefineToolWithInputSchema
    advice:
      - replace-function: github.com/braintrustdata/braintrust-sdk-go/trace/contrib/genkit.DefineToolWithInputSchema
  - id: genkit-definemultiparttool-tracing
    join-point:
      function-call: github.com/firebase/genkit/go/genkit.DefineMultipartTool
    advice:
      - replace-function: github.com/braintrustdata/braintrust-sdk-go/trace/contrib/genkit.DefineMultipartTool
