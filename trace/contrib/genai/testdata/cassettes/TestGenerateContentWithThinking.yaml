                        "text": "Let's break down the sequence: 2, 6, 12, 20, 30.\n\n**1. Finding the Pattern:**\n\n*   **Differences between consecutive terms:**\n    *   6 - 2 = 4\n    *   12 - 6 = 6\n    *   20 - 12 = 8\n    *   30 - 20 = 10\n\n*   **Differences of the differences (second differences):**\n    *   6 - 4 = 2\n    *   8 - 6 = 2\n    *   10 - 8 = 2\n\nSince the second differences are constant (always 2), this indicates that the sequence is a **quadratic sequence**, meaning its formula will involve $n^2$.\n\nThe pattern is that the difference between consecutive terms increases by 2 each time.\n\n**2. Finding the Formula for the nth Term ($a_n$):**\n\nThere are a couple of ways to approach this:\n\n**Method 1: Using the properties of quadratic sequences**\n\nFor a quadratic sequence $a_n = An^2 + Bn + C$:\n*   The second difference is equal to $2A$.\n*   The first term of the first differences is $3A + B$.\n*   The first term of the sequence is $A + B + C$.\n\nFrom our sequence:\n1.  **$2A = 2$** (since the second difference is 2) $\\Rightarrow A = 1$\n\n2.  **$3A + B = 4$** (since the first term of the first differences is 4)\n    Substitute $A=1$: $3(1) + B = 4 \\Rightarrow 3 + B = 4 \\Rightarrow B = 1$\n\n3.  **$A + B + C = 2$** (since the first term of the sequence is 2)\n    Substitute $A=1, B=1$: $1 + 1 + C = 2 \\Rightarrow 2 + C = 2 \\Rightarrow C = 0$\n\nSo, the formula is $a_n = 1n^2 + 1n + 0$, which simplifies to:\n**$a_n = n^2 + n$**\n\n**Method 2: Recognizing a common pattern**\n\nLet's write down the term number ($n$) and the value ($a_n$):\n\n*   n=1: $a_1 = 2$\n*   n=2: $a_2 = 6$\n*   n=3: $a_3 = 12$\n*   n=4: $a_4 = 20$\n*   n=5: $a_5 = 30$\n\nNotice that:\n*   $2 = 1 \\times 2$\n*   $6 = 2 \\times 3$\n*   $12 = 3 \\times 4$\n*   $20 = 4 \\times 5$\n*   $30 = 5 \\times 6$\n\nIt appears that each term is the product of the term number ($n$) and the next integer ($n+1$).\n\nSo, the formula is:\n**$a_n = n(n+1)$**\n\nThis formula is equivalent to $n^2 + n$.\n\n**In summary:**\n\n*   **Pattern:** Each term is found by adding an increment that increases by 2 each time (starting with +4, then +6, +8, +10, etc.). Alternatively, each term is the product of its term number and the next consecutive integer.\n*   **Formula for the nth term:** $a_n = n^2 + n$ or $a_n = n(n+1)$"
