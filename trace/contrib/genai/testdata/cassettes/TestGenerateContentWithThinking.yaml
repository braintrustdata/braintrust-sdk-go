                        "text": "Let's break down the sequence: 2, 6, 12, 20, 30.\n\n**1. Finding the Pattern:**\n\n*   **Step 1: Look at the differences between consecutive terms.**\n    *   6 - 2 = 4\n    *   12 - 6 = 6\n    *   20 - 12 = 8\n    *   30 - 20 = 10\n    The differences are: 4, 6, 8, 10. This is an arithmetic progression.\n\n*   **Step 2: Look at the differences between these differences (second differences).**\n    *   6 - 4 = 2\n    *   8 - 6 = 2\n    *   10 - 8 = 2\n    The second differences are constant, which is 2. This tells us the formula will be a quadratic ($an^2 + bn + c$).\n\n*   **Observation:** You might also notice a multiplication pattern:\n    *   2 = 1 * 2\n    *   6 = 2 * 3\n    *   12 = 3 * 4\n    *   20 = 4 * 5\n    *   30 = 5 * 6\n\n**The Pattern:**\nEach term is the product of its term number ($n$) and the next consecutive integer ($n+1$).\nAlternatively, the difference between consecutive terms increases by 2 each time.\n\n**2. Formula for the nth Term:**\n\nBased on the observation:\nIf 'n' represents the position of the term in the sequence:\n*   For the 1st term (n=1): 1 * (1+1) = 1 * 2 = 2\n*   For the 2nd term (n=2): 2 * (2+1) = 2 * 3 = 6\n*   For the 3rd term (n=3): 3 * (3+1) = 3 * 4 = 12\n*   For the 4th term (n=4): 4 * (4+1) = 4 * 5 = 20\n*   For the 5th term (n=5): 5 * (5+1) = 5 * 6 = 30\n\nSo, the formula for the nth term is:\n$a_n = n \\times (n+1)$\n\nYou can also expand this:\n$a_n = n^2 + n$\n\nLet's test it:\nFor n=6: $a_6 = 6^2 + 6 = 36 + 6 = 42$ (And following the difference pattern: 30 + 12 = 42, which matches)."
