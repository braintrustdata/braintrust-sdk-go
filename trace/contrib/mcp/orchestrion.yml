# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: github.com/braintrustdata/braintrust-sdk-go/trace/contrib/mcp
  description: Auto-instrumentation for the official MCP Go SDK with Braintrust tracing

aspects:
  - id: mcp-newclient-instrument
    join-point:
      function-call: github.com/modelcontextprotocol/go-sdk/mcp.NewClient
    advice:
      - wrap-expression:
          imports:
            tracemcp: github.com/braintrustdata/braintrust-sdk-go/trace/contrib/mcp
            mcp: github.com/modelcontextprotocol/go-sdk/mcp
          template: |-
            func() *mcp.Client {
              __client := mcp.NewClient({{ index .AST.Args 0 }}, {{ index .AST.Args 1 }})
              tracemcp.InstrumentClient(__client)
              return __client
            }()
  - id: mcp-newserver-instrument
    join-point:
      function-call: github.com/modelcontextprotocol/go-sdk/mcp.NewServer
    advice:
      - wrap-expression:
          imports:
            tracemcp: github.com/braintrustdata/braintrust-sdk-go/trace/contrib/mcp
            mcp: github.com/modelcontextprotocol/go-sdk/mcp
          template: |-
            func() *mcp.Server {
              __server := mcp.NewServer({{ index .AST.Args 0 }}, {{ index .AST.Args 1 }})
              tracemcp.InstrumentServer(__server)
              return __server
            }()
